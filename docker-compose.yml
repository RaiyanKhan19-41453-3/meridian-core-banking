services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: corebanking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corebanking}
      POSTGRES_USER: ${POSTGRES_USER:-corebanking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- .NET 10 Web API ----------
  api:
    build:
      context: ./src/CoreBanking.Api
    container_name: corebanking-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-corebanking};
        Username=${POSTGRES_USER:-corebanking};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: core-banking
      Jwt__Audience: core-banking-clients
      Jwt__ExpiryMinutes: "15"
      Jwt__RefreshDays: "7"
      Limits__MaxSingleTransaction: "250000"
      Limits__MaxDailyOutflow: "50000"
      Cors__Origins__0: http://localhost:8091
      Cors__Origins__1: http://localhost:5173
      RateLimiting__AuthPermitLimit: "1000"
      RateLimiting__MoneyPermitLimit: "1000"
      RateLimiting__WindowMinutes: "1"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------- React frontend (nginx) ----------
  frontend:
    build:
      context: ./frontend
    container_name: corebanking-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy

  # ---------- Optional DB admin UI (start with: docker compose --profile tools up) ----------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: corebanking-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
